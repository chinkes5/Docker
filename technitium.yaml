services:
  technitium:
    image: technitium/dns-server:latest
    container_name: technitium
    hostname: technitium
    restart: unless-stopped

    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "5380:5380/tcp"

    environment:
      - DNS_SERVER_DOMAIN=chinkes.huis
      - DNS_SERVER_ADMIN_PASSWORD=$PASSWORD

    volumes:
  beszel_data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=$NFS_IP,nolock,soft,rw,nfsvers=4
      device: :/volume5/docker/dns

    dns:
      - 1.1.1.1
      - 1.0.0.1
